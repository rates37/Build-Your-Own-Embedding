[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "BuildYourOwnEmbedding"
version = "2.0.0"
description = "A Python library for generating and analysing synthetic neural responses"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Satya Jhaveri" }
]
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.9.1",
    "matplotlib-inline>=0.1.6",
    "typing_extensions>=4.4.0",
    "mplcursors>=0.5.3",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
    "sphinxcontrib-jquery>=4.1",
]

[project.urls]
Homepage = "https://github.com/rates37/Build-Your-Own-Embedding"
Documentation = "https://rates37.github.io/build_your_own_embedding/"

[tool.hatch.build.targets.wheel]
packages = ["BuildYourOwnEmbedding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["BuildYourOwnEmbedding"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long
]

[tool.ruff.lint.isort]
known-first-party = ["BuildYourOwnEmbedding"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
